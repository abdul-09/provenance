[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "0.1.0"
description = "Tamper-evident writing-session certificates: prove a document was authored, not fabricated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42",
]

[project.scripts]
provenance = "provenance.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
include = ["provenance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=provenance",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["provenance"]

[tool.coverage.report]
show_missing = true
omit = ["provenance/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",
]
